name: Benchmark Validation

on:
  pull_request:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      - name: Compile core scripts
        run: .venv/bin/python -m py_compile qa_adiabatic_steps_bench.py compare_qa_sa_prr.py prr_local_detuning_opt.py comparison_common.py

      - name: Run unit tests
        run: .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run smoke checks
        run: |
          make smoke
          make smoke-perm
          make scan-smoke
          make compare-smoke
